<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadLibs Alien Invasion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="scripts.js" defer></script> 
</head>

<body> 
    <main>
        <section>
            <header>
                <h1>Alien Invasion</h1>
            </header>
        </section>
        <section id="madlib-questions">
            <img class="ufo" src="images/ufo.png" alt="illustrated ufo">
          
            <form id="myform">
                <div id="ans">
                    <div><label for="human">Adjective</label><input type="text" id="human"></div>
                    <div><label for="planet">Noun</label><input type="text" id="planet"></div>
                    <div><label for="how">-ing Verb </label><input type="text" id="how"></div>
                    <div><label for="describeP">Adjective</label><input type="text" id="describeP"></div>
                    <div><label for="ly">Adverb</label><input type="text" id="ly"></div>
                    <div><label for="doing">Verb</label><input type="text" id="doing"></div>
                    <div><label for="change">Adjective</label><input type="text" id="change"></div>
                    <div><label for="number">Number</label><input type="text" id="number"></div>
                    <div><label for="personality">Adjective</label><input type="text" id="personality"></div>
                    <div><label for="animal">Plural Animal</label><input type="text" id="animal"></div>
                    <div><label for="thing">Plural Noun</label><input type="text" id="thing"></div>
                    <div><label for="lost">Noun</label><input type="text" id="lost"></div>
                </div>   
            
                <div class="btn"><input type="submit" value="Start" id="button"></div>
            </form>
        </section>
    </main>
    <footer>
    <div class="grass"></div>
    </footer>
</body>
</html>
