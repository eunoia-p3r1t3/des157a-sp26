<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadLibs Alien Invasion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script> 
</head>

<body> 
    <main>
       <header>
            <h1>Alien Invasion</h1>
        </header>
        <img class="ufo" src="images/ufo.png" alt="illustrated ufo">
        <img class="alien" src="images/alien.png" alt="illustrated alien">

        <form>
            <div id="sec1">
            <label for="human">Adjective</label><input type="text" id="human" required>
            <label for="planet">Noun</label><input type="text" id="planet" required>
            <label for="how">Verb</label><input type="text" id="how" required>
            </div>
            <div>
            <label for="describeP">Adjective</label><input type="text" id="describeP" required>
            <label for="ly">an 'ly' Adjective</label><input type="text" id="ly" required>
            <label for="doing">Verb</label><input type="text" id="doing" required>
            </div>
            <div>
            <label for="change">Adjective</label><input type="text" id="change" required>
            <label for="number">Number</label><input type="text" id="number" required>
            <label for="personality">Adjective</label><input type="text" id="personality" required>
            </div>
            <div>
            <label for="animal">Animal</label><input type="text" id="animal" required>
            <label for="thing">Plural Noun</label><input type="text" id="thing" required>
            <label for="lost">Noun</label><input type="text" id="lost" required>
            </div>
            <div>
            <label for="what">Adjective</label><input type="text" id="what" required>
            <label for="name">Name</label><input type="text" id="name" required>
            </div>
            <input type="submit" value="Start" id="button">
        </form>
    </main>
</body>
</html>
