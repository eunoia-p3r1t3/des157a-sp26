<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP Experimentation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@500&display=swap" rel="stylesheet">
     <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>¿WhAt's iN My BaG?</h1>
        </header>
        <section id="mainpage">
        <div class="container">
            <img id="bag" src="images/bag.png" alt="My bag">
        </div>
        </section>
        <section id="inner">
        <div class="items">
            <div id="new">
            <img id="pods" src="images/airpods.png" alt="whats in my bag">
            <img id="rockout" class="hidden" src="images/letsrock.png" alt="whats in my bag">
            </div>
            
            <img id="baggy" src="images/baggy.png" alt="whats in my bag">
            <img id="phonec" src="images/phonecube.png" alt="whats in my bag">
            <img id="cube" src="images/cube.png" alt="whats in my bag">
            <img id="black" src="images/blackcharger.png" alt="whats in my bag">
            <img id="charger" src="images/charger.png" alt="whats in my bag">
            <img id="emer" src="images/emrgengykit.png" alt="whats in my bag">
            <img id="glass" src="images/glasses.png" alt="whats in my bag">
            <img id="peni" src="images/pencilcase.png" alt="whats in my bag">
            <img id="sketch" src="images/sketchbook.png" alt="whats in my bag">
            <img id="outline" src="images/osb.svg" alt="whats in my bag">
            <img id="plan" src="images/planner.png" alt="whats in my bag">
            <img id="pou" src="images/pouch.png" alt="whats in my bag">
            <img id="pow" src="images/powerbank.png" alt="whats in my bag">
            <img id="rule" src="images/ruller.png" alt="whats in my bag">
            
            <img id="sticky" src="images/stickynotes.png" alt="whats in my bag">
            <img id="wall" src="images/wallet.png" alt="whats in my bag">
            <img id="wires" src="images/wirehead.png" alt="whats in my bag">
        
        </div>
        
        </section>
        <section id="overlay" class="hidden">
        <article>
            <h2>whats inside my emergency kit?</h2>
            
            <img class="kit" src="images/emrgengykit.png" alt="emergnegy kit">
            <div class="contents">
             <img class="sew" src="images/sewer.png" alt="sewer cover">
             <img class="matcha" src="images/matcha.png" alt="matcha">
             <img class="alien" src="images/alien.png" alt="alien plushie">
             <img class="deoder" src="images/deoder.png" alt="aliuminium free deoderant">
             <img class="hand" src="images/handsan.png" alt="handsanitizer">
             <img class="onigiri" src="images/onigiri.png" alt="onigiri">
             <img class="eyes" src="images/eyes.png" alt="googly eyes">
             <img class="wet" src="images/wetfloor.png" alt="wet floor sign">
            </div>
            <button class="close">close</button>
        </article>
        </section>

         <section id="overlay2" class="hidden">
        <article>
            <h2>Take a look inside!!</h2>
            <img class="s1" src="images/sketch1.jpg" alt="sketchbook page">
            <img class="s2" src="images/sketch2.jpg" alt="sketchbook page">
            
            <button class="close2">close</button>
        </article>
        </section>
    </main>
</body>
</html>
